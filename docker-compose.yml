services:
  opds:
    image: ghcr.io/jacob-lasky/opds-abs:latest
    container_name: opds-abs
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PUID=1000
      - PGID=1000
      - AUDIOBOOKSHELF_INTERNAL_URL=http://audiobookshelf
      - AUDIOBOOKSHELF_EXTERNAL_URL=https://abs.example.com
      - AUTH_ENABLED=true
      - API_KEY_AUTH_ENABLED=false
      - CACHE_PERSISTENCE_ENABLED=true
      - ITEMS_PER_PAGE=25
    volumes:
      - ./data:/app/opds_abs/data
